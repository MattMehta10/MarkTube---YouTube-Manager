<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkTube Dev Preview</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <script>
      if (typeof global === 'undefined') {
        window.global = window;
      }
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: #020617;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }
      #dev-frame {
        width: 500px;
        height: 100vh;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        border-left: 1px solid #1e293b;
        border-right: 1px solid #1e293b;
        position: relative;
        overflow: hidden;
        background: #030712;
      }
      #root {
        width: 500px;
        height: 100vh;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="dev-frame">
      <div id="root"></div>
    </div>
    <script type="module" src="/src/sidebar/main.jsx"></script>
  </body>
</html>
